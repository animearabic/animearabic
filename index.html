<!DOCTYPE html>
<html lang="ar">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنمي بالعربي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}

body{background:#020617;color:white;}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:rgba(0,0,0,0.8);
  position:fixed;
  width:100%;
  top:0;
  z-index:999;
}

.logo{
  font-size:26px;
  color:#a855f7;
  font-weight:bold;
}

nav a{
  margin:0 10px;
  color:white;
  text-decoration:none;
}

/* HERO */
.hero{
  height:100vh;
  background:url('bg.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
}

.hero-content{
  position:relative;
}

.hero h1{
  font-size:50px;
}

.hero p{
  margin:15px 0;
}

.btn{
  background:#9333ea;
  padding:12px 25px;
  border-radius:10px;
  cursor:pointer;
}

/* SECTIONS */
.section{padding:100px 20px 20px;}

.section h2{
  color:#c084fc;
  margin-bottom:15px;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
}

.card{
  background:#0f172a;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px purple;
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.card h3{
  padding:10px;
}

/* PLAYER */
.player{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  top:0;
  left:0;
  justify-content:center;
  align-items:center;
}

.player iframe{
  width:95%;
  height:70%;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  background:black;
}

.contact{
  background:#9333ea;
  padding:10px 20px;
  border-radius:8px;
  color:white;
  text-decoration:none;
}
</style>
</head>
<body>

<header>
  <div class="logo">🎌 أنمي بالعربي</div>
  <nav>
    <a href="#today">أنمي اليوم</a>
    <a href="#best">أفضل الأنمي</a>
    <a href="login.html">تسجيل الدخول</a>
  </nav>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>أنمي بالعربي</h1>
    <p>أفضل موقع لمشاهدة الأنمي 🔥</p>
    <div class="btn" onclick="scrollDown()">ابدأ الآن</div>
  </div>
</div>

<!-- TODAY -->
<div class="section" id="today">
  <h2>🔥 أنمي اليوم</h2>
  <div class="cards" id="todayList"></div>
</div>

<!-- BEST -->
<div class="section" id="best">
  <h2>⭐ أفضل الأنميات</h2>
  <div class="cards" id="bestList"></div>
</div>

<!-- PLAYER -->
<div class="player" id="player" onclick="closePlayer()">
  <iframe id="frame" allowfullscreen></iframe>
</div>

<footer>
  <p>© أنمي بالعربي</p>
  <a class="contact" href="mailto:animeversearabic@gmail.com">📩 تواصل معنا</a>
</footer>

<script>
let data = JSON.parse(localStorage.getItem("animeData")) || [];

function getID(url){
 let reg = /(?:youtube\.com.*v=|youtu\.be\/)([^&]+)/;
 let match = url.match(reg);
 return match ? match[1] : url;
}

function render(){
 let today = document.getElementById("todayList");
 let best = document.getElementById("bestList");

 today.innerHTML="";
 best.innerHTML="";

 data.forEach(a=>{
  let id = getID(a.video);

  let card = `
  <div class="card" onclick="play('${id}')">
    <img src="${a.image}">
    <h3>${a.title}</h3>
  </div>`;

  if(a.type==="today"){
    today.innerHTML+=card;
  }else{
    best.innerHTML+=card;
  }
 });
}

render();

function play(id){
 document.getElementById("player").style.display="flex";
 document.getElementById("frame").src =
 "https://www.youtube.com/embed/"+id+"?autoplay=1";
}

function closePlayer(){
 document.getElementById("player").style.display="none";
 document.getElementById("frame").src="";
}

function scrollDown(){
 document.getElementById("today").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
