  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#020617;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#0f172a;
  padding:30px;
  border-radius:15px;
  width:90%;
  max-width:350px;
  text-align:center;
  box-shadow:0 0 20px purple;
}

h1{
  margin-bottom:20px;
  color:#a855f7;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#9333ea;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#7e22ce;
}

.note{
  margin-top:10px;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="box">
  <h1>🔐 تسجيل الدخول</h1>

  <input id="name" placeholder="الاسم">
  <input id="email" placeholder="البريد الإلكتروني">
  <input id="phone" placeholder="رقم الهاتف (اختياري)">

  <button onclick="login()">دخول</button>

  <div class="note">سيتم حفظ بياناتك على جهازك</div>
</div>

<script>
function login(){
 let user = {
   name: name.value,
   email: email.value,
   phone: phone.value
 };

 localStorage.setItem("user", JSON.stringify(user));
 alert("تم تسجيل الدخول ✅");
 window.location.href="index.html";
}
</script>

</body>
</html>
